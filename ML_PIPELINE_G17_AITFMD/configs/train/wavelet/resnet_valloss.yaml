seed: 42

model_config: "configs/models/resnet_3dcnn_v1.yaml"

data:
  cube_manifest_csv: "data/interim/wavelet_manifest.csv"
  cube_root: "data/processed_V2/wavelet16"
  mask_root: "data/interim/masks/final_mask"
  patch_h: 64
  patch_w: 64
  stride_h: 32
  stride_w: 32
  min_tissue_ratio: 0.3
  patches_per_cube: 64
  use_all_patches: false
  batch_size: 16
  max_cached_cubes: 12
  num_workers: 0
  augment: false

optimizer:
  name: "adam"
  lr: 5.0e-5
  weight_decay: 1.0e-4

scheduler:
  enabled: true
  name: "cosine"
  t_max_epochs: 50

loss:
  name: "cross_entropy"
  class_weighting: true
  label_smoothing: 0.0

trainer:
  max_epochs: 50
  early_stopping_patience: 8
  checkpoint_metric: "val_loss"
  mixed_precision: true
