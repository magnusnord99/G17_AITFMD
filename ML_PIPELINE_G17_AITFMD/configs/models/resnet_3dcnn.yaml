# ResNet-inspirert 3D CNN – residual blocks.
# Bedre gradient flow, ofte bedre på dypere nett.

model:
  name: "resnet_3dcnn"
  type: "3dcnn"

architecture:
  in_channels: 1
  num_classes: 2
  dropout: 0.45         # FC dropout
  block_dropout: 0.10   # dropout mellom conv1 og conv2 i hvert ResBlock
  stage_channels: [8, 16, 32]   # halverte kanaler (129k params vs 516k)
  num_blocks: [2, 2, 2]  # blocks per stage
  kernel_size: 3

input:
  patch_h: 64
  patch_w: 64

# L2: train.yaml → optimizer.weight_decay
