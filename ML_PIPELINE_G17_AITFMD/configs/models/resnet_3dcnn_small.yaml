# ResNet-inspirert 3D CNN – liten variant [8,16,32] ~129K param.

model:
  name: "resnet_3dcnn"
  type: "3dcnn"

architecture:
  in_channels: 1
  num_classes: 2
  dropout: 0.45
  block_dropout: 0.10
  stage_channels: [8, 16, 32]
  num_blocks: [2, 2, 2]
  kernel_size: 3

input:
  patch_h: 64
  patch_w: 64
